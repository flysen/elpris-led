name: Release

# Runs when a version tag is pushed, e.g.: git tag v2.1 && git push origin v2.1
# Stable tags (v2.1) are installed by lamps automatically. Release candidates (v2.1-rc1)
# are published as pre-releases only, for testing on your own lamp first.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history and tags for the tag checks

      - name: Check tag
        id: tag
        run: |
          bash scripts/check-release-tag.sh "$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: make test && make test-sanitize

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned cores and libraries
        run: bash scripts/arduino-deps.sh

      - name: Build ESP32 firmware
        run: bash scripts/build-firmware.sh "$GITHUB_REF_NAME" esp32

      - name: Build ESP8266 firmware
        run: bash scripts/build-firmware.sh "$GITHUB_REF_NAME" esp8266

      - name: Package install page and checksums
        run: bash scripts/package.sh "$GITHUB_REF_NAME"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.bin
            dist/SHA256SUMS
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true

      - name: Upload install page
        if: steps.tag.outputs.prerelease != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Only stable releases reach the install page, and with it every lamp's automatic updates
  deploy:
    needs: build
    if: needs.build.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
