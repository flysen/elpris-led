name: Release

# Körs när en versionstagg pushas, t.ex.: git tag v2.1 && git push origin v2.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Kör tester
        run: make test

      - uses: arduino/setup-arduino-cli@v2

      - name: Installera ESP32-kärna och bibliotek
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install FastLED ArduinoJson WiFiManager

      - name: Bygg firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build-out elpris_led

      - name: Förbered release och installationssida
        run: |
          VERSION="${GITHUB_REF_NAME}"
          B=build-out/elpris_led.ino
          BOOT_APP0=$(find ~/.arduino15/packages/esp32/hardware -name boot_app0.bin -print -quit)
          test -n "$BOOT_APP0"

          # Installationssidan: separata delar, så att wifi och inställningar behålls vid uppdatering
          mkdir -p site/firmware dist
          cp -r docs/. site/
          cp "$B.bootloader.bin" site/firmware/bootloader.bin
          cp "$B.partitions.bin" site/firmware/partitions.bin
          cp "$BOOT_APP0"        site/firmware/boot_app0.bin
          cp "$B.bin"            site/firmware/elpris-led.bin

          cat > site/manifest.json << EOF
          {
            "name": "Elpris-LED",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "firmware/bootloader.bin", "offset": 4096 },
                  { "path": "firmware/partitions.bin", "offset": 32768 },
                  { "path": "firmware/boot_app0.bin", "offset": 57344 },
                  { "path": "firmware/elpris-led.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF

          # Release-filer: en komplett image för esptool och en ren app-fil för OTA
          MERGED="$B.merged.bin"
          if [ ! -f "$MERGED" ]; then
            pip install esptool==4.8.1
            esptool.py --chip esp32 merge_bin -o "$MERGED" \
              0x1000 "$B.bootloader.bin" \
              0x8000 "$B.partitions.bin" \
              0xe000 "$BOOT_APP0" \
              0x10000 "$B.bin"
          fi
          cp "$MERGED" "dist/elpris-led-${VERSION}-esp32-full.bin"
          cp "$B.bin"  "dist/elpris-led-${VERSION}-esp32-ota.bin"

      - name: Skapa release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
