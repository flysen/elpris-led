name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: make test
      - name: Unit tests with sanitizers
        run: make test-sanitize

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts
        run: shellcheck scripts/*.sh

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 core and libraries
        run: bash scripts/arduino-deps.sh

      # Same build and packaging as a release, so a broken release is caught before tagging
      - name: Build and package firmware
        run: bash scripts/build-firmware.sh dev

      # Lets you flash a pull request build on your own lamp before releasing it
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: dist/
          retention-days: 14
